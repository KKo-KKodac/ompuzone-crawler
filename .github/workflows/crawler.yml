name: Compuzone Daily Price Crawler

on:
  schedule:
    # UTC 00:00 = 한국 시간(KST) 오전 09:00
    - cron: '0 0 * * *'
  workflow_dispatch: # 수동으로 바로 테스트해 볼 수 있는 버튼 생성

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v3

    - name: 파이썬 환경 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 필요한 라이브러리 설치
      run: |
        pip install -r requirements.txt

    - name: 구글 비밀키 파일 생성
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      run: |
        echo "$GCP_SA_KEY" > credentials.json

    - name: 파이썬 크롤러 실행
      run: |
        python main.py
